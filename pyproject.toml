[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ullrai-agent-mesh"
version = "0.1.0"
description = "Discover and call private agents over MQTT 5 from a browser, CLI, or MCP client"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "aiomqtt>=2.4,<3",
    "paho-mqtt>=2.1,<3",
    "aiohttp>=3.10,<4",
    "httpx>=0.27,<1",
    "jsonschema>=4.18,<5",
    "mcp>=1.12,<2",
    "PyYAML>=6,<7",
]

[project.scripts]
agent-mesh = "agent_mesh.cli:main"

[project.urls]
Repository = "https://github.com/UllrAI/AgentMesh"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mesh"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
