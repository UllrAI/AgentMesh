name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl git mosquitto mosquitto-clients
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest -q
      - run: uv build
